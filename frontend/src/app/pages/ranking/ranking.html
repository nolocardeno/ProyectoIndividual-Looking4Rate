<section class="rankings">
    <header>
        <h1 class="rankings__title">Top juegos</h1>
        <p class="rankings__subtitle"></p>
    </header>
    
    <ol class="rankings__list">
        @for (juego of ranking(); track juego.id) {
            <li>
                <app-ranking-item  [juego]="juego" />
            </li>
        }
    </ol>
</section>
